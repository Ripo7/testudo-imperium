<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>City lab · Testudo Imperium</title>
  <style>
    :root { --ink: #2b2118; --paper: #f3ead8; --line: #c9b48f; }
    html, body { margin: 0; height: 100%; background: #e9dfca; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #bar { position: fixed; left: 12px; top: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-width: 360px; }
    #bar h1 { font-size: 15px; margin: 0 0 4px; }
    #bar p { margin: 0 0 8px; color: #5a4a38; }
    #bar button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fffaf0; cursor: pointer; }
    #bar label { margin-left: 8px; white-space: nowrap; }
    #imps { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 0; }
    #imps label:first-child { margin-left: 0; }
    .tag { position: fixed; transform: translate(-50%, 0); background: rgba(243, 234, 216, 0.9); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 12px; pointer-events: none; white-space: nowrap; }
    @media (max-width: 600px) { #bar { right: 12px; max-width: none; } }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="bar">
    <h1>City lab</h1>
    <p>Every culture at every size, as the game builds them, with the improvements ticked below. Drag to turn, scroll or pinch to zoom.</p>
    <button id="reseed">New seeds</button>
    <label><input type="checkbox" id="walls" checked> Walls</label>
    <label title="The light version the game draws for distant cities"><input type="checkbox" id="far"> Far version</label>
    <span id="stats"></span>
    <div id="imps">
      <label><input type="checkbox" data-imp="forum" checked> Forum</label>
      <label><input type="checkbox" data-imp="temple" checked> Temple</label>
      <label><input type="checkbox" data-imp="barracks"> Barracks</label>
      <label><input type="checkbox" data-imp="farm"> Farmlands</label>
      <label><input type="checkbox" id="port" checked> Capital on the sea</label>
      <label><input type="checkbox" id="river"> A river through</label>
    </div>
  </div>
  <script type="module" src="/lab/citylab.js"></script>
</body>
</html>
